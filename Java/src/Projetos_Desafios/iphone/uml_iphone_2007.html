<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const def = `classDiagram
  class ReprodutorMusical {
    <<interface>>
    +tocar()
    +pausar()
    +selecionarMusica(String)
  }
  class AparelhoTelefonico {
    <<interface>>
    +ligar(String)
    +atender()
    +iniciarCorreioVoz()
  }
  class NavegadorInternet {
    <<interface>>
    +exibirPagina(String)
    +adicionarNovaAba()
    +atualizarPagina()
  }
  class iPhone {
    -musicaAtual String
    -tocando boolean
    -chamadaAtiva String
    -abasAbertas List
    +tocar()
    +pausar()
    +selecionarMusica(String)
    +ligar(String)
    +atender()
    +iniciarCorreioVoz()
    +exibirPagina(String)
    +adicionarNovaAba()
    +atualizarPagina()
  }
  ReprodutorMusical <|.. iPhone
  AparelhoTelefonico <|.. iPhone
  NavegadorInternet <|.. iPhone
`;
const { svg } = await mermaid.render('erd-svg', def);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.classDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d], rect');
  if (!firstPath) return;
});
</script>
